name: Build & Publish Dalamud (estell)

# rioriopu/Dalamud をビルドし、estell-dalamud-distrib へ配布(Release zip + version/meta 更新)する。
# パッチ当日は「Run workflow」から game_version と dalamud_ref を指定して実行する。

on:
  workflow_dispatch:
    inputs:
      game_version:
        description: '対応ゲームバージョン (例: 2026.06.02.0000.0000)。空なら config.yaml の applicableGameVersion を使用'
        required: false
        default: ''
      dalamud_ref:
        description: 'ビルドする rioriopu/Dalamud の ref (branch/tag/sha)'
        required: false
        default: 'master'
      track:
        description: '配信トラック名'
        required: false
        default: 'estell'
      estell_build:
        description: 'estell ビルド番号(例: 8)。空なら Actions の run 番号を使用。run 番号がリセットされた場合に前回より大きい値を明示指定する'
        required: false
        default: ''

env:
  DISTRIB_REPO: rioriopu/estell-dalamud-distrib
  DALAMUD_REPO: rioriopu/Dalamud

concurrency:
  group: estell-publish-${{ inputs.track || 'estell' }}
  cancel-in-progress: false

jobs:
  build-publish:
    # 2026-10-12: 本家が VS2026 / v145 へ移行し CMakePresets から vs2022 が消えた。
    # v145 のツールセットを持つイメージが要るので、本家 CI と同じ windows-2025 に合わせる。
    runs-on: windows-2025
    steps:
      - name: Checkout declarative (config)
        uses: actions/checkout@v4
        with:
          path: declarative

      - name: Checkout Dalamud fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DALAMUD_REPO }}
          ref: ${{ inputs.dalamud_ref }}
          submodules: recursive
          fetch-depth: 0
          path: Dalamud

      - name: Checkout distrib (write target)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DISTRIB_REPO }}
          token: ${{ secrets.DISTRIB_PAT }}
          path: distrib

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # バージョンはビルドより前に決める。Dalamud 内部の SCMVersion に同じ値を埋め込まないと、
      # 配布マニフェストの AssemblyVersion(末尾に -estell.N が付く)と食い違い、
      # プラグインインストーラが「新しいバージョンがあります」と誤表示するため。
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $track = "${{ inputs.track }}"
          if ([string]::IsNullOrWhiteSpace($track)) { $track = "estell" }

          try {
            $describe = (git -C Dalamud describe --tags --long).Trim()
          } catch {
            $csproj = Get-Content "Dalamud/Dalamud/Dalamud.csproj" -Raw
            $baseVer = [regex]::Match($csproj, '<DalamudVersion>(.*?)</DalamudVersion>').Groups[1].Value
            $sha = (git -C Dalamud rev-parse --short HEAD).Trim()
            $describe = "$baseVer-0-g$sha"
          }

          $buildNo = "${{ inputs.estell_build }}"
          if ([string]::IsNullOrWhiteSpace($buildNo)) { $buildNo = $env:GITHUB_RUN_NUMBER }

          "track=$track"                    >> $env:GITHUB_OUTPUT
          "version=$describe-$track.$buildNo" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version = $describe-$track.$buildNo"

      # 2026-09-27: 本家が NUKE を撤去し(PR #2982)、ビルドが CMake + dotnet build の
      # 2 段構成になった。あわせて CreateHashList.ps1 が tools/create_hashlist.ps1 へ移動。
      # 旧 `.\build.ps1 Compile` はもう存在しないので、本家 CI(main.yml)と同じ手順に合わせる。
      - name: Install CMake
        shell: pwsh
        env:
          CMAKE_VERSION: '4.2.0'
        run: |
          $name = "cmake-$env:CMAKE_VERSION-windows-x86_64"
          $url = "https://cmake.org/files/v$($env:CMAKE_VERSION -replace '\.\d+$', '')"
          Invoke-WebRequest "$url/$name.zip" -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Invoke-WebRequest "$url/cmake-$env:CMAKE_VERSION-SHA-256.txt" -OutFile "$env:RUNNER_TEMP\cmake.sha256"

          $expected = (Select-String -Path "$env:RUNNER_TEMP\cmake.sha256" -Pattern "  $name.zip$").Line.Split(' ')[0]
          $actual = (Get-FileHash "$env:RUNNER_TEMP\cmake.zip" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "CMake checksum mismatch: $actual != $expected" }

          Expand-Archive "$env:RUNNER_TEMP\cmake.zip" $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\$name\bin" >> $env:GITHUB_PATH

      # 本家 CI と同じく、ネイティブのバージョンリソース用に VERSION を置く。
      - name: Define VERSION
        working-directory: Dalamud
        shell: pwsh
        run: |
          "Dalamud"                                   >> VERSION
          "${{ inputs.track }}"                       >> VERSION
          (git rev-parse --short HEAD).Trim()         >> VERSION

      - name: Build native projects
        working-directory: Dalamud
        shell: pwsh
        run: |
          cmake --preset vs2026
          cmake --build build --config Release -- "/clp:NoSummary;ForceNoAlign"

      - name: Build Dalamud (Release)
        working-directory: Dalamud
        shell: pwsh
        env:
          # MSBuild は環境変数をプロパティとして解決する。Dalamud.csproj の GetVersionData は
          # SCMVersion が空のときだけ git describe を使うので、ここで渡した値が優先される。
          SCMVersion: ${{ steps.ver.outputs.version }}
        run: |
          dotnet build Dalamud/Dalamud.csproj -c Release -tl:off "/clp:NoSummary;ForceNoAlign"
          dotnet build Dalamud.Injector/Dalamud.Injector.csproj -c Release -tl:off "/clp:NoSummary;ForceNoAlign"

      - name: Test configuration recovery
        working-directory: Dalamud
        shell: pwsh
        env:
          SCMVersion: ${{ steps.ver.outputs.version }}
        run: dotnet test Dalamud.Test/Dalamud.Test.csproj -c Release --filter FullyQualifiedName~ConfigurationRecoveryTests -tl:off

      - name: Create hash list
        working-directory: Dalamud
        shell: pwsh
        run: .\tools\create_hashlist.ps1 .\bin\Release

      - name: Package latest.zip
        working-directory: Dalamud
        shell: pwsh
        run: Compress-Archive -Path .\bin\Release\* -DestinationPath "$env:GITHUB_WORKSPACE\latest.zip" -Force

      - name: Generate version / meta
        id: gen
        shell: pwsh
        run: |
          $track = "${{ inputs.track }}"
          if ([string]::IsNullOrWhiteSpace($track)) { $track = "estell" }

          # --- config.yaml 読み込み ---
          Install-Module powershell-yaml -Force -Scope CurrentUser -AllowClobber | Out-Null
          Import-Module powershell-yaml
          $cfg = Get-Content "declarative/config.yaml" -Raw | ConvertFrom-Yaml
          $tc = $cfg.tracks[$track]
          if ($null -eq $tc) { throw "config.yaml に track '$track' がありません" }

          $key  = [string]$tc.key
          $rv   = [string]$tc.runtimeVersion
          $rreq = [bool]$tc.runtimeRequired
          $disp = [string]$tc.displayName
          $desc = [string]$tc.description
          $hidden = [bool]$tc.hidden

          # 公式配信元が旧ランタイムを配信しなくなると、新規導入や再取得だけが失敗する。
          # 本体ビルドやZIPの検査では検出できないため、公開する前に取得先も確認する。
          if ($rreq) {
            & ./declarative/scripts/Test-RuntimeAvailability.ps1 -RuntimeVersion $rv
          }

          $gv = "${{ inputs.game_version }}"
          if ([string]::IsNullOrWhiteSpace($gv)) { $gv = [string]$tc.applicableGameVersion }

          # --- バージョン ---
          # Resolve version ステップで決めた値をそのまま使う(ビルド時の SCMVersion と同一)。
          $ver = "${{ steps.ver.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) { throw "バージョンが解決できていません" }

          if ($ver -notmatch '^[0-9A-Za-z.+_-]+$') { throw "不正な配布バージョン: $ver" }
          $archiveName = "$ver.zip"
          $dl = "https://github.com/$($env:DISTRIB_REPO)/releases/download/$track/$archiveName"
          $mirror = "https://estelldprereleaserepo.net/estell/dalamud/$archiveName"
          $sha256 = (Get-FileHash "$env:GITHUB_WORKSPACE/latest.zip" -Algorithm SHA256).Hash.ToLowerInvariant()

          # --- {track}/version (PascalCase, DalamudVersionInfo) ---
          $versionObj = [ordered]@{
            Track           = $track
            AssemblyVersion = $ver
            SupportedGameVer = $gv
            RuntimeVersion  = $rv
            RuntimeRequired = $rreq
            Key             = $key
            DownloadUrl     = $dl
            MirrorDownloadUrl = $mirror
            DownloadSha256  = $sha256
          }
          New-Item -ItemType Directory -Force "distrib/$track" | Out-Null
          ($versionObj | ConvertTo-Json -Compress) | Out-File -Encoding utf8 -NoNewline "distrib/$track/version"

          # --- meta.json (camelCase, ブランチ辞書) ---
          $metaObj = [ordered]@{
            $track = [ordered]@{
              displayName = $disp
              description = $desc
              track       = $track
              hidden      = $hidden
              key         = $key
              assemblyVersion = $ver
              runtimeVersion  = $rv
              runtimeRequired = $rreq
              supportedGameVer = $gv
              isApplicableForCurrentGameVer = $true
            }
          }
          ($metaObj | ConvertTo-Json -Depth 5) | Out-File -Encoding utf8 "distrib/meta.json"

          "track=$track"  >> $env:GITHUB_OUTPUT
          "version=$ver"  >> $env:GITHUB_OUTPUT
          "gamever=$gv"   >> $env:GITHUB_OUTPUT
          "archive=$archiveName" >> $env:GITHUB_OUTPUT
          Write-Host "Generated $track version=$ver gamever=$gv"

      - name: Upload zip to distrib release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_PAT }}
        run: |
          $track = "${{ steps.gen.outputs.track }}"
          $ver   = "${{ steps.gen.outputs.version }}"
          gh release view $track --repo $env:DISTRIB_REPO 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $track --repo $env:DISTRIB_REPO --title "estell $track" --notes "Auto-published by build-and-publish.yml"
          }
          # 古いマニフェストが参照するlatest.zipは変更しない。
          # 版別ZIPを先に公開し、同じURLの中身を後から入れ替えない。
          $archive = "${{ steps.gen.outputs.archive }}"
          Copy-Item "$env:GITHUB_WORKSPACE/latest.zip" "$env:GITHUB_WORKSPACE/$archive"
          gh release upload $track "$env:GITHUB_WORKSPACE/$archive" --repo $env:DISTRIB_REPO
          if ($LASTEXITCODE -ne 0) { throw "版別ZIPの公開に失敗しました。既存の版別ZIPは上書きしません。" }

      - name: Commit & push distrib (version / meta)
        working-directory: distrib
        shell: bash
        run: |
          git config user.name "rioriopu"
          git config user.email "rioriopuu@gmail.com"
          git add -A
          git commit -m "estell: publish ${{ steps.gen.outputs.version }} for ${{ steps.gen.outputs.gamever }}" || echo "no changes"
          git push

      # GitHub が落ちても配れるよう、自前 VPS にも同じものを置く。
      # 本体を検証してから版情報を切り替える。同期の失敗も検出する。
      - name: Mirror to VPS
        shell: bash
        env:
          VPS_TARGET: ${{ secrets.VPS_TARGET }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          MIRROR_DIR: /home/ubuntu/estelld-repo/static/estell
          ARCHIVE_NAME: ${{ steps.gen.outputs.archive }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_SSH_KEY:-}" ] || [ -z "${VPS_TARGET:-}" ]; then
            echo "VPS の Secrets が未設定のため配布を完了できません"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_mirror
          chmod 600 ~/.ssh/id_mirror
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          SSH="ssh -i $HOME/.ssh/id_mirror -o BatchMode=yes -o ConnectTimeout=30"
          SCP="scp -i $HOME/.ssh/id_mirror -o BatchMode=yes -o ConnectTimeout=30"

          $SSH "$VPS_TARGET" "mkdir -p $MIRROR_DIR/dalamud"

          # 版別本体を仮転送し、照合後にだけ公開する。
          $SCP "$GITHUB_WORKSPACE/latest.zip" "$VPS_TARGET:$MIRROR_DIR/dalamud/$ARCHIVE_NAME.upload-$GITHUB_RUN_ID"

          # 転送事故を検出する(100MB 級なので必ず照合する)
          # sha256sum の出力に \ が付くこと(パスにバックスラッシュを含む場合)があるので除去する
          LOCAL=$(sha256sum "$GITHUB_WORKSPACE/latest.zip" | cut -d' ' -f1 | tr -d '\\')
          REMOTE=$($SSH "$VPS_TARGET" "sha256sum $MIRROR_DIR/dalamud/$ARCHIVE_NAME.upload-$GITHUB_RUN_ID | cut -d' ' -f1")
          echo "local =$LOCAL"
          echo "remote=$REMOTE"
          [ "$LOCAL" = "$REMOTE" ] || { echo "ハッシュ不一致"; exit 1; }

          # 公開済みの同じ版があれば、内容が一致する場合だけ再利用する。
          $SSH "$VPS_TARGET" "if test -f $MIRROR_DIR/dalamud/$ARCHIVE_NAME; then cmp $MIRROR_DIR/dalamud/$ARCHIVE_NAME $MIRROR_DIR/dalamud/$ARCHIVE_NAME.upload-$GITHUB_RUN_ID; else mv $MIRROR_DIR/dalamud/$ARCHIVE_NAME.upload-$GITHUB_RUN_ID $MIRROR_DIR/dalamud/$ARCHIVE_NAME; fi"
          $SCP "distrib/${{ steps.gen.outputs.track }}/version" "$VPS_TARGET:$MIRROR_DIR/dalamud/version.upload-$GITHUB_RUN_ID"
          $SCP distrib/meta.json "$VPS_TARGET:$MIRROR_DIR/dalamud/meta.json.upload-$GITHUB_RUN_ID"
          $SSH "$VPS_TARGET" "mv $MIRROR_DIR/dalamud/version.upload-$GITHUB_RUN_ID $MIRROR_DIR/dalamud/version; mv $MIRROR_DIR/dalamud/meta.json.upload-$GITHUB_RUN_ID $MIRROR_DIR/dalamud/meta.json"

          $SSH "$VPS_TARGET" "date -Is > $MIRROR_DIR/dalamud/last-sync.txt"
          echo "ミラー同期が完了しました"

          rm -f ~/.ssh/id_mirror
